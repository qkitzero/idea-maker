services:
  # frontend:
  #   build:
  #     context: ../idea-maker-frontend
  #     dockerfile: ./Dockerfile
  #   container_name: idea-maker-frontend
  #   restart: always
  #   ports:
  #     - "${FRONTEND_HOST_PORT}:${FRONTEND_CONTAINER_PORT}"

  auth-server:
    build:
      context: ../auth-service
      dockerfile: ./build/auth/Dockerfile
    container_name: idea-maker-auth-server
    restart: always
    environment:
      - ENV=${ENV}
      - PORT=${AUTH_SERVER_CONTAINER_PORT}
      - AUTH0_BASE_URL=${AUTH0_BASE_URL}
      - AUTH0_CLIENT_ID=${AUTH0_CLIENT_ID}
      - AUTH0_CLIENT_SECRET=${AUTH0_CLIENT_SECRET}
      - AUTH0_AUDIENCE=${AUTH0_AUDIENCE}
    ports:
      - "${AUTH_SERVER_HOST_PORT}:${AUTH_SERVER_CONTAINER_PORT}"
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=localhost:${AUTH_SERVER_CONTAINER_PORT}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  user-server:
    build:
      context: ../user-service
      dockerfile: ./build/user/Dockerfile
    container_name: idea-maker-user-server
    restart: always
    environment:
      - ENV=${ENV}
      - PORT=${USER_SERVER_CONTAINER_PORT}
      - DB_HOST=${USER_DB_HOST}
      - DB_USER=${USER_DB_USER}
      - DB_PASSWORD=${USER_DB_PASSWORD}
      - DB_NAME=${USER_DB_NAME}
      - DB_PORT=${USER_DB_CONTAINER_PORT}
      - DB_SSL_MODE=${USER_DB_SSL_MODE}
      - AUTH_SERVICE_HOST=${AUTH_SERVER_HOST}
      - AUTH_SERVICE_PORT=${AUTH_SERVER_CONTAINER_PORT}
    depends_on:
      user-db:
        condition: service_healthy
    ports:
      - "${USER_SERVER_HOST_PORT}:${USER_SERVER_CONTAINER_PORT}"
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=localhost:${USER_SERVER_CONTAINER_PORT}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  combination-server:
    build:
      context: ../combination-service
      dockerfile: ./build/combination/Dockerfile
    container_name: idea-maker-combination-server
    restart: always
    environment:
      - ENV=${ENV}
      - PORT=${COMBINATION_SERVER_CONTAINER_PORT}
      - DB_HOST=${COMBINATION_DB_HOST}
      - DB_USER=${COMBINATION_DB_USER}
      - DB_PASSWORD=${COMBINATION_DB_PASSWORD}
      - DB_NAME=${COMBINATION_DB_NAME}
      - DB_PORT=${COMBINATION_DB_CONTAINER_PORT}
      - DB_SSL_MODE=${COMBINATION_DB_SSL_MODE}
      - AUTH_SERVICE_HOST=${AUTH_SERVER_HOST}
      - AUTH_SERVICE_PORT=${AUTH_SERVER_CONTAINER_PORT}
    depends_on:
      combination-db:
        condition: service_healthy
    ports:
      - "${COMBINATION_SERVER_HOST_PORT}:${COMBINATION_SERVER_CONTAINER_PORT}"
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=localhost:${COMBINATION_SERVER_CONTAINER_PORT}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  logging-server:
    build:
      context: ../logging-service
      dockerfile: ./Dockerfile
      secrets:
        - npmrc
    container_name: idea-maker-logging-server
    restart: always
    environment:
      - ENV=${ENV}
      - PORT=${LOGGING_SERVER_CONTAINER_PORT}
      - DB_URL=${LOGGING_DB_URL}
      - AUTH_SERVICE_HOST=${AUTH_GRPC_GATEWAY_HOST}
      - AUTH_SERVICE_PORT=${AUTH_GRPC_GATEWAY_CONTAINER_PORT}
    depends_on:
      logging-db:
        condition: service_healthy
    ports:
      - "${LOGGING_SERVER_HOST_PORT}:${LOGGING_SERVER_CONTAINER_PORT}"

  user-db:
    image: postgres:17
    container_name: idea-maker-user-db
    restart: always
    environment:
      POSTGRES_DB: ${USER_DB_NAME}
      POSTGRES_USER: ${USER_DB_USER}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}
    ports:
      - "${USER_DB_HOST_PORT}:${USER_DB_CONTAINER_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER_DB_USER}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    volumes:
      - idea-maker-user-db-data:/var/lib/postgresql/data

  combination-db:
    image: postgres:17
    container_name: idea-maker-combination-db
    restart: always
    environment:
      POSTGRES_DB: ${COMBINATION_DB_NAME}
      POSTGRES_USER: ${COMBINATION_DB_USER}
      POSTGRES_PASSWORD: ${COMBINATION_DB_PASSWORD}
    ports:
      - "${COMBINATION_DB_HOST_PORT}:${COMBINATION_DB_CONTAINER_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${COMBINATION_DB_USER}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    volumes:
      - idea-maker-combination-db-data:/var/lib/postgresql/data

  logging-db:
    image: postgres:17
    container_name: idea-maker-logging-db
    restart: always
    environment:
      POSTGRES_DB: ${LOGGING_DB_NAME}
      POSTGRES_USER: ${LOGGING_DB_USER}
      POSTGRES_PASSWORD: ${LOGGING_DB_PASSWORD}
    ports:
      - "${LOGGING_DB_HOST_PORT}:${LOGGING_DB_CONTAINER_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LOGGING_DB_USER}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    volumes:
      - idea-maker-logging-db-data:/var/lib/postgresql/data

  auth-grpc-gateway:
    build:
      context: ../auth-service
      dockerfile: ./build/gateway/Dockerfile
    container_name: idea-maker-auth-grpc-gateway
    restart: always
    environment:
      - ENV=${ENV}
      - PORT=${AUTH_GRPC_GATEWAY_CONTAINER_PORT}
      - SERVER_HOST=${AUTH_SERVER_HOST}
      - SERVER_PORT=${AUTH_SERVER_CONTAINER_PORT}
    ports:
      - "${AUTH_GRPC_GATEWAY_HOST_PORT}:${AUTH_GRPC_GATEWAY_CONTAINER_PORT}"

  user-grpc-gateway:
    build:
      context: ../user-service
      dockerfile: ./build/gateway/Dockerfile
    container_name: idea-maker-user-grpc-gateway
    restart: always
    environment:
      - ENV=${ENV}
      - PORT=${USER_GRPC_GATEWAY_CONTAINER_PORT}
      - SERVER_HOST=${USER_SERVER_HOST}
      - SERVER_PORT=${USER_SERVER_CONTAINER_PORT}
    ports:
      - "${USER_GRPC_GATEWAY_HOST_PORT}:${USER_GRPC_GATEWAY_CONTAINER_PORT}"

  combination-grpc-gateway:
    build:
      context: ../combination-service
      dockerfile: ./build/gateway/Dockerfile
    container_name: idea-maker-combination-grpc-gateway
    restart: always
    environment:
      - ENV=${ENV}
      - PORT=${COMBINATION_GRPC_GATEWAY_CONTAINER_PORT}
      - SERVER_HOST=${COMBINATION_SERVER_HOST}
      - SERVER_PORT=${COMBINATION_SERVER_CONTAINER_PORT}
    ports:
      - "${COMBINATION_GRPC_GATEWAY_HOST_PORT}:${COMBINATION_GRPC_GATEWAY_CONTAINER_PORT}"

volumes:
  idea-maker-user-db-data:
  idea-maker-combination-db-data:
  idea-maker-logging-db-data:

secrets:
  npmrc:
    file: .npmrc